name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------- Simulador de Cobertura de Escalas (simulador-escalas/) ----------------
  simulador-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulador-escalas/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: escalas
          POSTGRES_PASSWORD: escalas
          POSTGRES_DB: escalas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U escalas" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://escalas:escalas@localhost:5432/escalas
      TEST_POSTGRES_URL: postgresql+psycopg2://escalas:escalas@localhost:5432/escalas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -c "import escalas.main"
      - run: ruff check escalas tests alembic
      - run: mypy escalas tests
      - run: pytest --cov=escalas/services/engine --cov-report=term-missing
      - run: alembic upgrade head && alembic downgrade base
      - run: python scripts/export_openapi.py --check

  simulador-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulador-escalas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: simulador-escalas/frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/types.ts
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  simulador-e2e:
    runs-on: ubuntu-latest
    needs: [simulador-backend, simulador-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -e .
        working-directory: simulador-escalas/backend
      - run: npm ci && npm i --no-save playwright && npx playwright install --with-deps chromium
        working-directory: simulador-escalas/frontend
      - run: npm run e2e
        working-directory: simulador-escalas/frontend

  # ---------------- App de atas (backend/ + frontend/ na raiz) ----------------------------
  atas-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn openpyxl python-multipart httpx
      - run: >-
          python -c "from fastapi.testclient import TestClient; from app.main import app;
          c = TestClient(app); assert c.get('/health').json() == {'status': 'ok'}"

  atas-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
