[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-escalas-backend"
version = "0.1.0"
description = "API do Simulador de Cobertura de Escalas 24/7"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "pyyaml==6.0.2",
  "python-multipart==0.0.20",
  "openpyxl==3.1.5",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "ortools==9.14.6206",  # v3.7: otimizadores CP-SAT (versão fixada)
]

[project.optional-dependencies]
dev = [
  "ruff==0.8.6",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "types-PyYAML==6.0.12.20241230",
  "hypothesis==6.122.3",
  "pytest-benchmark==5.1.0",
]

[tool.setuptools.packages.find]
include = ["escalas*"]

[tool.setuptools.package-data]
"escalas.services.engine" = ["seeds/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos/sinais em português

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "escalas.services.engine.*"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
