services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: escalas
      POSTGRES_PASSWORD: escalas
      POSTGRES_DB: escalas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalas"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
